|----------------------------------------------|
|------------ configuration files -------------|
|----------------------------------------------|
configuration: conf/8x8x8x8b6.0000id3n1
format: 0

|----------------------------------------------|
|----------- Select right hand side -----------|
|----------------------------------------------|
| 0 - ones, 1 - first unit vector, 2 - random  |
right hand side: 0

|----------------------------------------------|
|--- Information about the lattice geometry ---|
|----------------------------------------------|
| ordering = [ T, Z, Y, X ]                    |
| 0 - periodic, 1 - antiperiodic in time,      |
| 2 - twisted                                  |
|----------------------------------------------|
boundary conditions: 1
number of levels: 3
number of openmp threads: 1

|--- depth 0 ----------------------------------|
d0 global lattice: 8 8 8 8
d0 local lattice: 4 4 4 8        // 8 MPI-Prozesse, Prozessgitter 2 x 2 x 2 x 1
d0 block lattice: 2 2 2 2
d0 preconditioner cycles: 1
d0 post smooth iter: 5
d0 block iter: 4                 // wird von Richardson nicht benutzt
d0 test vectors: 24
d0 setup iter: 4
d0 mu factor: 1.0

|--- depth 1 ----------------------------------|
d1 global lattice: 4 4 4 4
d1 local lattice: 2 2 2 4        // weiterhin 8 Prozesse -> keine Agglomeration
d1 block lattice: 2 2 2 2
d1 preconditioner cycles: 2      
d1 post smooth iter: 5
d1 block iter: 4
d1 test vectors: 28
d1 setup iter: 2
d1 mu factor: 1.0

|--- depth 2 (groebstes Level) ----------------|
d2 global lattice: 2 2 2 2
d2 local lattice: 1 1 1 2
d2 mu factor: 1.0

|----------------------------------------------|
|----------- Multilevel parameters ------------|
|----------------------------------------------|
mixed precision: 2
odd even preconditioning: 1      // Pflicht fuer den direkten Loeser
interpolation: 2
randomize test vectors: 0

// nur im Setup aktiv (in der Solve-Phase loest ScaLAPACK)
coarse grid iterations: 30
coarse grid restarts: 50
coarse grid tolerance: 1E-1

coarse grid gcrodr_k: 5
coarse grid gcrodr_k_setup: 5
coarse grid gcrodr_k_solve: 5
coarse grid gcrodr_upd_itrs_setup: 0
coarse grid gcrodr_upd_itrs_solve: 0

coarse grid polyprec_d: 2
coarse grid polyprec_d_setup: 2
coarse grid polyprec_d_solve: 2

|--- Zyklus und Glaetter: LINEAR --------------|
kcycle: 1                        // Pflicht fuer Richardson bei 3 Leveln
kcycle length: 5                 
kcycle restarts: 2              
kcycle tolerance: 1E-1         
wcycle: 0                        // no w cycles instead do k-cycles

// ScaLAPACK-Groebstgitterloeser: rows x cols = Anzahl MPI-Prozesse (8)
scalap 2d grid rows: 4
scalap 2d grid cols: 2
scalap 2d blocksize: 112

|----------------------------------------------|
|-------------- Wilson operator ---------------|
|----------------------------------------------|
m0: -0.6
setup m0: -0.6
csw: 1.0
mu: 0.001
setup mu: 0.001
mu odd shift: 0.0
mu even shift: 0.0
addDownPropagator: 0

|----------------------------------------------|
|--------------- Select method ----------------|
|----------------------------------------------|
method: 2
richardson smoother: 1           // Richardson statt red-black Schwarz
richardson power iterations: 5

|----------------------------------------------|
| linearity test = 0 - off                     |
| linearity test = 1 - test M, then solve      |
| linearity test = 2 - test M only, no solve   |
|----------------------------------------------|
linearity test: 2

|----------------------------------------------|
|--------- Wilson FGMRES parameters -----------|
|----------------------------------------------|
iterations between restarts: 10
maximum of restarts: 400
tolerance for relative residual: 1E-10

|----------------------------------------------|
|------------- General settings ---------------|
|----------------------------------------------|
print mode: 1

|----------------------------------------------|
|------------ Tracking parameters -------------|
|----------------------------------------------|
evaluation: 0
